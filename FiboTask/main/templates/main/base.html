<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}FiboTask{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'main/style.css' %}" />
  </head>
  <body>
    <nav class="nav">
      <a href="{% url 'main:index' %}">To-Do List</a>
      <a href="{% url 'main:fibonacci' %}">Fibonacci Generator</a>
    </nav>
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    <div class="container">{% block content %}{% endblock %}</div>
  </body>
</html>
